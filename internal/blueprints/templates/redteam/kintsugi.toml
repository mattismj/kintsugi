# generated by `kintsugi new redteam` — review and edit freely.
# Secrets are never stored here: providers name the env var (api_key_env) that
# holds the key.

[workspace]
profile = "lab"                     # lab | engagement | research (affects default tool profiles)
network = "egress-deny"             # default deny; per-brief allowlist

[core]
mode = "offline"                    # offline | normal  (offline refuses non-loopback endpoints)
# Set the provider/model this workspace uses; leave it commented to inherit the
# global default. `kintsugi models` lists what is available.
# default_model = "deepseek/deepseek-chat"

[permissions]
# Workspace-relative globs. The tasking harness has no business reading keys.
deny_paths = ["**/.env", "**/.env.*", "**/id_rsa", "**/id_ed25519", "**/*.pem", "**/.git/**"]
# Command prefixes that run without asking. Keep it to build/test/format.
allow_commands = ["go build", "go test", "go vet", "gofmt"]
# Regular expressions refused outright.
deny_commands = ["rm\\s+-[a-zA-Z]*[rf][a-zA-Z]*\\s+/(\\s|$)", "\\bmkfs(\\.|\\s)", "\\bdd\\s+if="]

[context]
enabled = true
path = "CONTEXT.md"
# Authorization/scope stay operator-authored no matter what the curator proposes.
gated_classes = ["authorization", "scope"]
